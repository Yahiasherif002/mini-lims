services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lims
      POSTGRES_USER: lims
      POSTGRES_PASSWORD: lims
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lims"]
      interval: 2s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lims
    depends_on:
      db:
        condition: service_healthy

  tests:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /src
    command: mvn -B verify
    volumes:
      - .:/src
      - m2:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lims
    depends_on:
      db:
        condition: service_healthy

volumes:
  m2:
