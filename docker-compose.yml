services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lims
      POSTGRES_USER: lims
      POSTGRES_PASSWORD: lims
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lims"]
      interval: 2s
      retries: 30

  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health"]
      interval: 3s
      retries: 60

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lims
      SPRING_ELASTICSEARCH_URIS: http://search:9200
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8081/realms/lims
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/lims/protocol/openid-connect/certs
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_healthy
      keycloak:
        condition: service_started

  tests:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /src
    command: mvn -B verify
    volumes:
      - .:/src
      - m2:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lims
      SPRING_ELASTICSEARCH_URIS: http://search:9200
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_healthy

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    profiles: [oracle]
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: lims
      APP_USER_PASSWORD: lims
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      retries: 60

  tests-oracle:
    image: maven:3.9-eclipse-temurin-21
    profiles: [oracle]
    working_dir: /src
    command: mvn -B verify
    volumes:
      - .:/src
      - m2:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      SPRING_ELASTICSEARCH_URIS: http://search:9200
    depends_on:
      oracle:
        condition: service_healthy
      search:
        condition: service_healthy

volumes:
  m2:
